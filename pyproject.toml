[project]
name = "lerobot_policy_openvla_oft"
version = "0.1.0"
description = "OpenVLA-OFT policy plugin for LeRobot"
readme = "README.md"
authors = [
    { name = "HUANG TZU-CHUN", email = "tzu.chun.huang.tw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.6.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# The tool settings below are adapted from LeRobot v0.6.1 pyproject.toml.

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM"]
ignore = [
    "E501", # Line too long
    "T201", # Print statement found
    "T203", # Pprint statement found
    "B008", # Perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lerobot_policy_openvla_oft"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
exclude_dirs = ["tests", "third_party"]
skips = ["B101", "B311", "B404", "B603", "B615"]

[tool.typos]
files.extend-exclude = ["third_party"]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # spellchecker:disable-line
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # spellchecker:<on|off>
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
exclude = ["^third_party/"]

[dependency-groups]
dev = [
    "pre-commit>=3.7.0,<5.0.0",
    "pytest>=8.1.0,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
